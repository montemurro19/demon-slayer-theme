name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --no-audit --no-fund
      - name: Generated themes are up to date
        run: npm run check
      - name: Package (validates the manifest)
        run: npx vsce package --out /tmp/extension.vsix
